name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.mod

      - name: Go vet and race tests
        working-directory: server
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Typecheck and build UI
        working-directory: ui
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Verify single-file UI has no external asset URLs
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          html_path = pathlib.Path("assets/app.html")
          if not html_path.is_file() or html_path.stat().st_size == 0:
              sys.exit("assets/app.html is missing or empty")

          text = html_path.read_text(encoding="utf-8")

          # Forbid external HTML/CSS asset tags, CDN domains, and hardcoded external fetches.
          ci_patterns = [
              r'<script\b[^>]*\bsrc=["\']?https?://[^"\'\s>]+',
              r'<link\b[^>]*\bhref=["\']?https?://[^"\'\s>]+',
              r'<img\b[^>]*\bsrc=["\']?https?://[^"\'\s>]+',
              r'<iframe\b[^>]*\bsrc=["\']?https?://[^"\'\s>]+',
              r'@import\s+(?:url\()?["\']?https?://[^"\')\s;]+',
              r'fetch\(\s*["\']https?://[^"\']+',
              r'https?://(?:fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com|esm\.sh|www\.googletagmanager\.com)[^\s"\'<>`)]*',
          ]
          matches = []
          for pat in ci_patterns:
              matches.extend(re.findall(pat, text, flags=re.IGNORECASE))
          # Check CSS url(http...) case-sensitively so JS `new URL(...)` is not flagged.
          matches.extend(re.findall(r'(?<![A-Za-z0-9_])url\(\s*["\']?https?://[^"\')\s]+', text))
          if matches:
              sys.exit(f"External asset/network URLs found in assets/app.html: {matches[:10]}")

          print(f"OK: assets/app.html verified ({html_path.stat().st_size} bytes, 0 external asset URLs)")
          PY

  release:
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cross-compile release binaries
        run: make release-bins

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum agy-info-* > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
